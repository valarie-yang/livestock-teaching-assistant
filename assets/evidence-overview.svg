<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2500" viewBox="0 0 1440 2500">
<defs><style>
.bg{fill:#0B0D12}.p{fill:#141821;stroke:#2A3140}.p2{fill:#10141C;stroke:#344054}.w{fill:#F7F8FB}.ink{fill:#F6F7F9}.muted{fill:#AAB3C2}.dim{fill:#6F7A8C}.orange{fill:#FF8A3D}.cyan{fill:#4ED6C6}.blue{fill:#78A7FF}.green{fill:#77D69E}.yellow{fill:#F3C76A}.red{fill:#FF7D7D}.line{stroke:#303847}.h1{font:750 58px Inter,Arial;letter-spacing:-2px}.h2{font:700 31px Inter,Arial}.h3{font:700 20px Inter,Arial}.body{font:17px Inter,Arial}.small{font:14px Inter,Arial}.tiny{font:11px Inter,Arial}.label{font:700 12px Inter,Arial;letter-spacing:1.3px}
</style></defs>
<rect class="bg" width="1440" height="2500"/>
<text x="72" y="56" class="label green">CASE 02 · APPLIED AI / DOMAIN LEARNING</text><text x="1368" y="56" text-anchor="end" class="small muted">AI DETAIL · 02 / 02</text><line x1="72" y1="80" x2="1368" y2="80" class="line"/>
<text x="72" y="156" class="label cyan">PUBLIC-SAFE PROTOTYPE EVIDENCE</text><text x="72" y="226" class="h1 ink">Turn expert reasoning</text><text x="72" y="292" class="h1 ink">into a teachable loop.</text><text x="72" y="342" class="body muted">AI-Assisted Livestock Teaching Assistant · case observation · evidence · review · remediation</text>
<rect x="930" y="135" width="438" height="220" rx="12" class="p"/><text x="960" y="174" class="label green">THE PRODUCT DECISION</text><text x="960" y="220" class="h3 ink">Support learning,</text><text x="960" y="248" class="h3 ink">not clinical diagnosis.</text><line x1="960" y1="270" x2="1338" y2="270" class="line"/><text x="960" y="304" class="small muted">Low confidence routes to expert</text><text x="960" y="326" class="small muted">review instead of false certainty.</text>
<rect x="72" y="402" width="1296" height="548" rx="12" class="p"/><text x="102" y="440" class="label cyan">TEACHER REVIEW CONSOLE · SYNTHETIC CASE PROTOTYPE</text>
<rect x="102" y="472" width="808" height="432" rx="8" class="w"/><rect x="102" y="472" width="808" height="40" rx="8" fill="#15302D"/><text x="128" y="498" class="tiny" fill="#C8DAD3">LIVESTOCK LEARNING · TEACHER REVIEW</text><text x="884" y="498" text-anchor="end" class="tiny" fill="#77D69E">SYNTHETIC CASE</text><rect x="102" y="512" width="174" height="392" fill="#FFF"/><text x="124" y="548" font-family="Inter" font-size="11" font-weight="700" fill="#1B2333">CLASSROOM</text><text x="124" y="586" font-family="Inter" font-size="11" fill="#697386">Case library</text><rect x="116" y="604" width="146" height="32" rx="5" fill="#E0F6EE"/><text x="126" y="625" font-family="Inter" font-size="11" fill="#19734F">Review queue</text><text x="124" y="668" font-family="Inter" font-size="11" fill="#697386">Remediation</text><text x="124" y="702" font-family="Inter" font-size="11" fill="#697386">Progress</text><rect x="276" y="512" width="634" height="392" fill="#F7F8FB"/><text x="304" y="554" font-family="Inter" font-size="11" fill="#697386">CASE REVIEW · LOW CONFIDENCE</text><text x="304" y="594" font-family="Inter" font-size="23" font-weight="700" fill="#1B2333">Reduced feed intake</text><rect x="304" y="614" width="572" height="80" rx="6" fill="#FFF" stroke="#E1E6EF"/><text x="324" y="640" font-family="Inter" font-size="10" fill="#697386">LEARNER OBSERVATION</text><text x="324" y="668" font-family="Inter" font-size="12" fill="#1B2333">“Animal is less active; feed intake fell.”</text><rect x="304" y="710" width="276" height="112" rx="6" fill="#FFF" stroke="#E1E6EF"/><text x="324" y="736" font-family="Inter" font-size="10" fill="#697386">EVIDENCE TO CHECK</text><text x="324" y="764" font-family="Inter" font-size="11" fill="#1B2333">water / temperature / history</text><text x="324" y="788" font-family="Inter" font-size="11" fill="#1B2333">observation quality / missing data</text><rect x="600" y="710" width="276" height="112" rx="6" fill="#FFFDF4" stroke="#F1D796"/><text x="620" y="736" font-family="Inter" font-size="10" fill="#9A6C13">AI DRAFT · REVIEW REQUIRED</text><text x="620" y="764" font-family="Inter" font-size="11" fill="#1B2333">Hypothesis + feedback draft</text><text x="620" y="788" font-family="Inter" font-size="10" fill="#697386">Not a diagnosis or treatment.</text><rect x="304" y="838" width="572" height="34" rx="6" fill="#193B38"/><text x="324" y="861" font-family="Inter" font-size="11" fill="#77D69E">Teacher review → release feedback → assign re-practice</text>
<rect x="940" y="472" width="402" height="432" rx="8" class="p2"/><text x="968" y="514" class="label green">WHY THIS IS EVIDENCE</text><text x="968" y="558" class="small ink">A domain agent is not just a chat box.</text><text x="968" y="598" class="small muted">It has case input, evidence quality,</text><text x="968" y="624" class="small muted">confidence, teacher review and</text><text x="968" y="650" class="small muted">remediation output.</text><line x1="968" y1="676" x2="1314" y2="676" class="line"/><text x="968" y="714" class="label orange">SAFE RELEASE</text><text x="968" y="754" class="small muted">Teacher publishes feedback.</text><text x="968" y="780" class="small muted">AI cannot diagnose or prescribe.</text><text x="968" y="828" class="label yellow">CONTENT BOUNDARY</text><text x="968" y="864" class="tiny dim">synthetic cases · no textbook/exam</text><text x="968" y="886" class="tiny dim">or student records in public repo</text>
<g transform="translate(72,1012)"><rect width="300" height="216" rx="10" class="p2"/><text x="22" y="36" class="label green">MY ROLE</text><text x="22" y="72" class="small ink">Learning workflow, rubric,</text><text x="22" y="98" class="small ink">governance and review gates.</text><text x="22" y="150" class="label dim">RESULT</text><text x="22" y="178" class="small muted">Safe domain-learning loop.</text><rect x="324" width="300" height="216" rx="10" class="p2"/><text x="346" y="36" class="label cyan">INPUTS</text><text x="346" y="72" class="small ink">Case observation + hypothesis</text><text x="346" y="98" class="small ink">goal + teacher rubric.</text><text x="346" y="150" class="label dim">OUTPUTS</text><text x="346" y="178" class="small muted">Evidence + feedback + practice.</text><rect x="648" width="300" height="216" rx="10" class="p2"/><text x="670" y="36" class="label blue">CONTROL</text><text x="670" y="72" class="small ink">Low confidence → review queue</text><text x="670" y="98" class="small ink">→ teacher release.</text><text x="670" y="150" class="label dim">AI BOUNDARY</text><text x="670" y="178" class="small muted">Organize, not diagnose.</text><rect x="972" width="396" height="216" rx="10" class="p2"/><text x="994" y="36" class="label red">NOT CLAIMED</text><text x="994" y="72" class="small muted">Clinical validity / treatment</text><text x="994" y="98" class="small muted">school outcome / production rollout</text><text x="994" y="124" class="small muted">private source implementation</text><text x="994" y="178" class="tiny dim">/livestock-teaching-assistant</text></g>
<line x1="72" y1="1300" x2="1368" y2="1300" class="line"/><text x="72" y="1350" class="label cyan">LEARNING LOOP</text><text x="72" y="1402" class="h2 ink">Observation → reasoning → feedback → teacher review → re-practice</text><g transform="translate(72,1450)"><rect width="216" height="78" rx="8" class="p"/><text x="22" y="32" class="label yellow">01</text><text x="22" y="58" class="small ink">Observe / submit</text><line x1="216" y1="39" x2="248" y2="39" class="line"/><rect x="248" width="216" height="78" rx="8" class="p"/><text x="270" y="32" class="label cyan">02</text><text x="270" y="58" class="small ink">Reason / evidence</text><line x1="464" y1="39" x2="496" y2="39" class="line"/><rect x="496" width="216" height="78" rx="8" class="p"/><text x="518" y="32" class="label blue">03</text><text x="518" y="58" class="small ink">AI draft / confidence</text><line x1="712" y1="39" x2="744" y2="39" class="line"/><rect x="744" width="216" height="78" rx="8" class="p"/><text x="766" y="32" class="label orange">04</text><text x="766" y="58" class="small ink">Teacher review</text><line x1="960" y1="39" x2="992" y2="39" class="line"/><rect x="992" width="216" height="78" rx="8" fill="#193B38" stroke="#2D5B55"/><text x="1014" y="32" class="label green">05</text><text x="1014" y="58" class="small green">Re-practice</text></g>
<rect x="72" y="1630" width="1296" height="360" rx="12" class="p"/><text x="102" y="1674" class="label green">RECRUITER WALKTHROUGH · 2 MINUTES</text><text x="102" y="1724" class="small ink">1 · Start with a fictional case and show how missing evidence lowers confidence.</text><text x="102" y="1766" class="small ink">2 · Show the AI draft as a structured teaching aid, not as a clinical answer.</text><text x="102" y="1808" class="small ink">3 · Close the loop with teacher review, released feedback and targeted re-practice.</text><line x1="102" y1="1850" x2="1338" y2="1850" class="line"/><text x="102" y="1892" class="small muted">Evidence level: public-safe product case + synthetic demonstration package</text><text x="102" y="1932" class="mono cyan">github.com/valarie-yang/livestock-teaching-assistant</text>
</svg>
