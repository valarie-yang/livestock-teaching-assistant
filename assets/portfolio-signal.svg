<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted livestock teaching workflow</title><desc id="desc">A learner submits a hypothesis, receives structured feedback, then enters teacher review and remediation.</desc>
  <rect width="1200" height="420" rx="28" fill="#101827"/><text x="56" y="72" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">AI-Assisted Livestock Teaching Assistant</text><text x="56" y="108" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Education workflow with domain governance, low-confidence review and controlled release.</text>
  <g font-family="Arial, sans-serif"><g fill="#182235" stroke="#38BDF8" stroke-width="2"><rect x="56" y="180" width="210" height="112" rx="16"/><rect x="338" y="180" width="210" height="112" rx="16"/><rect x="620" y="180" width="210" height="112" rx="16"/><rect x="902" y="180" width="210" height="112" rx="16"/></g><g fill="#E2E8F0" font-size="21" font-weight="700" text-anchor="middle"><text x="161" y="224">LEARNER REASONING</text><text x="443" y="224">STRUCTURED FEEDBACK</text><text x="725" y="224">TEACHER REVIEW</text><text x="1007" y="224">REMEDIATION</text></g><g fill="#94A3B8" font-size="15" text-anchor="middle"><text x="161" y="254">observation + hypothesis</text><text x="443" y="254">rubric + confidence signal</text><text x="725" y="254">publish gate + override</text><text x="1007" y="254">spaced re-practice</text></g><g stroke="#F59E0B" stroke-width="4" fill="none"><path d="M276 236h50"/><path d="M558 236h50"/><path d="M840 236h50"/></g></g>
  <text x="56" y="360" fill="#FBBF24" font-family="Arial, sans-serif" font-size="17">Synthetic educational cases · teacher controlled · not veterinary diagnosis or treatment advice</text>
</svg>
